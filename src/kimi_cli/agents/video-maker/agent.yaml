version: 1
agent:
  extend: default
  name: video-maker
  system_prompt_path: ./system.md
  compaction_prompt_path: ./compact.md
  system_prompt_args:
    ROLE_ADDITIONAL: ""
  tools:
    - "kimi_cli.tools.multiagent:Task"
    - "kimi_cli.tools.todo:SetTodoList"
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.file:ReadMediaFile"
    - "kimi_cli.tools.file:WriteFile"
    - "kimi_cli.tools.file:Glob"
    - "kimi_cli.tools.file:Grep"
    - "kimi_cli.tools.video:ManageVideoProject"
  subagents:
    screenwriter:
      path: ../screenwriter/agent.yaml
      description: "编剧 agent。Builds, edits, and validates Story Graph (story-graph.json) — the structured graph representation of a story. Converts user descriptions into graph with characters, events, states, camera directives, and audio. Can incrementally edit existing graphs and check for logical/consistency issues."
    image-creator:
      path: ../image-creator/agent.yaml
      description: "参考图生成 agent。生成两层参考图（实体图 + 状态图），含 prompt 语义校验。只生成图片，不生成视频或音频。"
    video-creator:
      path: ../video-creator/agent.yaml
      description: "视频生成 agent。生成 shot plan，逐 shot 决策生成方式并生成视频片段（含首帧图生成、尾帧提取）。只生成视频，不生成参考图或音频。"
    audio-creator:
      path: ../audio-creator/agent.yaml
      description: "音频生成 agent。生成 BGM（Suno）和对白/旁白 TTS（Minimax）。只生成原始音频文件，不做混合或时间对齐。"
    video-editor:
      path: ../video-editor/agent.yaml
      description: "后期编辑 agent。负责视频组装：裁剪、拼接、转场、逐 shot 合成对白、叠加 BGM、字幕。不生成素材，只用已有的视频片段和音频文件组装成片。"
    video-evaluator:
      path: ../video-evaluator/agent.yaml
      description: "评估 agent。视觉评估：评估参考图、首帧图、视频片段和成片的质量。支持 VLM 分析和截图评估两种模式。"
