version: 1
agent:
  extend: default
  name: video-creator
  system_prompt_path: ./system.md
  system_prompt_args:
    ROLE_ADDITIONAL: ""
  tools:
    # Base tools inherited from default
    - "kimi_cli.tools.multiagent:Task"
    - "kimi_cli.tools.ask_user:AskUserQuestion"
    - "kimi_cli.tools.todo:SetTodoList"
    - "kimi_cli.tools.shell:Shell"
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.file:ReadMediaFile"
    - "kimi_cli.tools.file:Glob"
    - "kimi_cli.tools.file:Grep"
    - "kimi_cli.tools.file:WriteFile"
    - "kimi_cli.tools.file:StrReplaceFile"
    - "kimi_cli.tools.web:SearchWeb"
    - "kimi_cli.tools.web:FetchURL"
    # Story graph tools
    - "kimi_cli.tools.story_graph:LinearizeStoryGraph"
    # Video-specific tools
    - "kimi_cli.tools.video:ManageVideoProject"
    - "kimi_cli.tools.video:GenerateVideo"
    - "kimi_cli.tools.video:GenerateVideoSync"
    - "kimi_cli.tools.video:CheckVideoJob"
    - "kimi_cli.tools.video:ExtractFrame"
    - "kimi_cli.tools.video:GenerateImage"
    # Audio-specific tools
    - "kimi_cli.tools.audio:GenerateMusic"
    - "kimi_cli.tools.audio:CheckMusicJob"
    - "kimi_cli.tools.audio:GenerateSpeech"
  subagents:
    coder:
      path: ../default/sub.yaml
      description: "Good at general software engineering tasks."
    video-evaluator:
      path: ../video-evaluator/agent.yaml
      description: "视觉评估 agent。校验 prompt 语义准确性、评估参考图/首帧图/视频质量。支持 Prompt 校验（eval-guide-prompt.md）、参考图评估（eval-guide-refimage.md）、首帧图评估（eval-guide-first-frame.md）、视频评估（eval-guide-video.md）。"
