version: 1
agent:
  extend: default
  name: video-evaluator
  system_prompt_path: ./system.md
  system_prompt_args:
    ROLE_ADDITIONAL: ""
  tools:
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.file:ReadMediaFile"
    - "kimi_cli.tools.file:WriteFile"
    - "kimi_cli.tools.file:StrReplaceFile"
    - "kimi_cli.tools.file:Glob"
    - "kimi_cli.tools.file:Grep"
    # Optional VLM-based analysis/comparison (fallback when image_in/video_in is unavailable)
    - "kimi_cli.tools.video:AnalyzeImage"
    - "kimi_cli.tools.video:AnalyzeVideo"
    - "kimi_cli.tools.video:CompareVideos"
    - "kimi_cli.tools.video:ExtractFrame"
  subagents: {}
