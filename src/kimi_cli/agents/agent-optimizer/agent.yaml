version: 1
agent:
  extend: default
  name: agent-optimizer
  system_prompt_path: ./system.md
  system_prompt_args:
    ROLE_ADDITIONAL: ""
  tools:
    - "kimi_cli.tools.ask_user:AskUserQuestion"
    - "kimi_cli.tools.todo:SetTodoList"
    # File operations for reading logs, prompts, configs
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.file:WriteFile"
    - "kimi_cli.tools.file:StrReplaceFile"
    - "kimi_cli.tools.file:Glob"
    - "kimi_cli.tools.file:Grep"
    - "kimi_cli.tools.shell:Shell"
    # Agent graph analysis
    - "kimi_cli.tools.agent_graph:AnalyzeAgentGraph"
    # Sub-agent communication
    - "kimi_cli.tools.multiagent:ChatWithAgent"
  subagents:
    paper-researcher:
      path: ../paper-researcher/agent.yaml
      description: "论文研究助手：搜索、阅读、提炼 AI Agent 相关论文，对比分析论文方法与当前系统的差异和适用性。"
